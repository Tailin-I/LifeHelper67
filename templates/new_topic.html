{% extends "base.html" %}
{% block title %}Новая тема{% endblock %}
{% block content %}
<h2>Создание темы</h2>
<form method="POST">
    <input type="text" name="title" placeholder="Заголовок темы" required style="width:100%;padding:10px;margin-bottom:10px;">
    <textarea name="content" rows="6" placeholder="Текст сообщения..." required style="width:100%;padding:10px;"></textarea>
    <button type="submit" style="margin-top:10px;">Создать</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Новая тема — Life Helper{% endblock %}
{% block content %}
<nav class="breadcrumbs">
    <a href="/">Главная</a> →
    <a href="/forum/{{ forum_id }}">Форумы</a> →
    <span>Новая тема</span>
</nav>

<div class="new-topic-form">
    <h2>Создание новой темы</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Заголовок темы</label>
            <input type="text" id="title" name="title" required placeholder="Введите заголовок...">
        </div>

        <div class="form-group">
            <label for="content">Сообщение</label>
            <textarea id="content" name="content" rows="8" required placeholder="Напишите ваше сообщение..."></textarea>
        </div>

        <div class="form-group">
            <label for="images">📎 Прикрепить изображения</label>
            <input type="file" id="images" name="images" multiple accept="image/png,image/jpeg,image/gif,image/webp">
            <small class="form-text">
                Можно выбрать несколько файлов. Макс. размер каждого: 16MB.<br>
                Поддерживаемые форматы: PNG, JPG, GIF, WebP
            </small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-create">Создать тему</button>
            <a href="/forum/{{ forum_id }}" class="btn-cancel">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
